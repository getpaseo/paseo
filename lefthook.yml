pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{css,js,json,jsonc,jsx,md,ts,tsx,yaml,yml}"
      exclude:
        - "package-lock.json"
        - "**/package-lock.json"
      run: npm run format:check:files -- {staged_files}
    - name: lint
      glob: "*.{js,jsx,ts,tsx}"
      run: npm run lint -- {staged_files}
    - name: typecheck
      run: npm run typecheck

pre-push:
  jobs:
    - name: local-release-inventory
      use_stdin: true
      run: node scripts/check-local-release-push.mjs
