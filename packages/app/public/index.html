<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* Prevent white flash before React mounts */
      @media (prefers-color-scheme: dark) {
        html, body {
          background-color: #181B1A;
        }
      }
      /* Base dark scrollbar — replaced by JS once React mounts with exact theme colors */
      @media (prefers-color-scheme: dark) {
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1A181B; }
        ::-webkit-scrollbar-thumb { background: rgba(117,113,116,0.45); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(117,113,116,0.85); }
        ::-webkit-scrollbar-corner { background: #1A181B; }
        * { scrollbar-width: thin; scrollbar-color: rgba(117,113,116,0.45) #1A181B; }
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style>
      button,
      a,
      input,
      textarea,
      select,
      [role='button'],
      [role='link'],
      [role='textbox'],
      [role='combobox'],
      [role='tab'],
      [role='switch'],
      [role='checkbox'],
      [role='slider'],
      [role='menuitem'],
      [tabindex],
      [contenteditable='true'] {
        -webkit-app-region: no-drag !important;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
