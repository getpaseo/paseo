appId: sh.paseo.debug
---
# The app must be connected to a daemon older than the app that predates
# terminalsSurviveRestart (0.8.0). See native-daemon-outdated-notice-preconditions.md.
- launchApp
- runFlow:
    when:
      visible: ".*getRegistrationInfoAsync.*"
    commands:
      - tapOn: ".*getRegistrationInfoAsync.*"
      - tapOn: Dismiss
- extendedWaitUntil:
    visible: "Open menu"
    timeout: 60000
- tapOn: "Open menu"
- extendedWaitUntil:
    visible:
      id: daemon-outdated-callout
    timeout: 30000
- assertVisible: "Daemon out of date"
- assertVisible: ".*daemon v${DAEMON_VERSION}.*"
- assertVisible: "Updating restarts the daemon and closes open terminals."
- assertVisible:
    id: daemon-outdated-callout-update
    enabled: true
- takeScreenshot: native-daemon-outdated-notice
