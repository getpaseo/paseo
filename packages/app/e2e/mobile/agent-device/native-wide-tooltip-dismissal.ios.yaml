appId: sh.paseo.debug
---
- launchApp
- runFlow:
    when:
      visible: ".*getRegistrationInfoAsync.*"
    commands:
      - tapOn: ".*getRegistrationInfoAsync.*"
      - tapOn: Dismiss
- assertNotVisible: ".*getRegistrationInfoAsync.*"
- extendedWaitUntil:
    visible:
      id: context-window-meter
    timeout: 30000
- tapOn:
    id: context-window-meter
- assertVisible:
    id: context-window-meter-tooltip
- tapOn:
    id: tooltip-dismiss
- assertNotVisible:
    id: context-window-meter-tooltip
- tapOn:
    id: context-window-meter
- assertVisible:
    id: context-window-meter-tooltip
- tapOn:
    id: tooltip-dismiss
- assertNotVisible:
    id: context-window-meter-tooltip
