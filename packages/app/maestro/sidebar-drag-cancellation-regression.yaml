appId: ${PASEO_MAESTRO_APP_ID}
---
- launchApp:
    clearState: true

- runFlow: flows/dev-client.yaml
- runFlow: flows/connect-direct-if-welcome.yaml

- extendedWaitUntil:
    visible:
      id: "menu-button"
    timeout: 60000

- tapOn:
    id: "menu-button"

- extendedWaitUntil:
    visible:
      id: "sidebar-project-list"
    timeout: 10000

- extendedWaitUntil:
    visible:
      text: ".*${PASEO_MAESTRO_DRAG_A_NAME}, Create a new workspace for ${PASEO_MAESTRO_DRAG_A_NAME}, Project actions"
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: ".*${PASEO_MAESTRO_DRAG_B_NAME}, Create a new workspace for ${PASEO_MAESTRO_DRAG_B_NAME}, Project actions"
    timeout: 30000

# A slow swipe stays inside the stationary slop long enough to arm the native
# long-press drag before it moves the second project above the first.
- assertVisible:
    text: ".*${PASEO_MAESTRO_DRAG_A_NAME}, Create a new workspace for ${PASEO_MAESTRO_DRAG_A_NAME}, Project actions"
    above:
      text: ".*${PASEO_MAESTRO_DRAG_B_NAME}, Create a new workspace for ${PASEO_MAESTRO_DRAG_B_NAME}, Project actions"
- swipe:
    from:
      text: ".*${PASEO_MAESTRO_DRAG_B_NAME}, Create a new workspace for ${PASEO_MAESTRO_DRAG_B_NAME}, Project actions"
    direction: UP
    duration: 20000
    waitToSettleTimeoutMs: 0

# A second touch during the drop spring must not cancel the committed reorder.
- tapOn:
    text: ".*${PASEO_MAESTRO_DRAG_B_NAME}, Create a new workspace for ${PASEO_MAESTRO_DRAG_B_NAME}, Project actions"
- assertVisible:
    text: ".*${PASEO_MAESTRO_DRAG_B_NAME}, Create a new workspace for ${PASEO_MAESTRO_DRAG_B_NAME}, Project actions"
    above:
      text: ".*${PASEO_MAESTRO_DRAG_A_NAME}, Create a new workspace for ${PASEO_MAESTRO_DRAG_A_NAME}, Project actions"

# Horizontal movement after the lift stays with the lifted row: the panel does
# not close, the drop commits no reorder, and the outer list stays scrollable.
- swipe:
    from:
      text: ".*${PASEO_MAESTRO_DRAG_B_NAME}, Create a new workspace for ${PASEO_MAESTRO_DRAG_B_NAME}, Project actions"
    direction: LEFT
    duration: 20000
- assertVisible:
    id: "sidebar-project-list"
- assertVisible:
    text: ".*${PASEO_MAESTRO_DRAG_B_NAME}, Create a new workspace for ${PASEO_MAESTRO_DRAG_B_NAME}, Project actions"
    above:
      text: ".*${PASEO_MAESTRO_DRAG_A_NAME}, Create a new workspace for ${PASEO_MAESTRO_DRAG_A_NAME}, Project actions"

# Reaching a fixture at the bottom proves the outer scroll still works after
# the horizontal drag.
- scrollUntilVisible:
    element:
      text: ".*${PASEO_MAESTRO_DRAG_Z_NAME}, Create a new workspace for ${PASEO_MAESTRO_DRAG_Z_NAME}, Project actions"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: true
- assertVisible:
    text: ".*${PASEO_MAESTRO_DRAG_Z_NAME}, Create a new workspace for ${PASEO_MAESTRO_DRAG_Z_NAME}, Project actions"

- scrollUntilVisible:
    element:
      text: ".*${PASEO_MAESTRO_DRAG_A_NAME}, Create a new workspace for ${PASEO_MAESTRO_DRAG_A_NAME}, Project actions"
    direction: UP
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: true

# A real reorder after the horizontal drag proves the list is not merely scrollable;
# its drag recognizer and semantic order update both recovered.
- swipe:
    from:
      text: ".*${PASEO_MAESTRO_DRAG_A_NAME}, Create a new workspace for ${PASEO_MAESTRO_DRAG_A_NAME}, Project actions"
    direction: UP
    duration: 20000
- assertVisible:
    text: ".*${PASEO_MAESTRO_DRAG_A_NAME}, Create a new workspace for ${PASEO_MAESTRO_DRAG_A_NAME}, Project actions"
    above:
      text: ".*${PASEO_MAESTRO_DRAG_B_NAME}, Create a new workspace for ${PASEO_MAESTRO_DRAG_B_NAME}, Project actions"
