name: Release Mobile

on:
  push:
    tags:
      - "v*-fork.*"
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS
    type: build
    env:
      PASEO_RELEASE_TAG: ${{ github.ref_name }}
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Upload iOS to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
