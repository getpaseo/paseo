apply plugin: 'com.android.library'

group = 'expo.modules.wearbridge'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

buildscript {
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
}

project.android {
  compileSdkVersion safeExtGet("compileSdkVersion", 35)
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }
}

android {
  namespace "expo.modules.wearbridge"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // The Data Layer. Note for F-Droid: this is a proprietary Google Play Services
  // dependency, so a source-only build of the phone app must exclude this module.
  implementation "com.google.android.gms:play-services-wearable:20.0.1"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.11.0"
}
