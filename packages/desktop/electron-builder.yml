npmRebuild: false
appId: ai.hubcode.desktop
productName: Hubcode
executableName: Hubcode
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@gethubcode/server/dist/server/terminal/shell-integration/**/*
extraResources:
  - from: ../app/dist
    to: app-dist
  - from: ../../skills
    to: skills
publish:
  provider: github
  owner: gethubcode
  repo: hubcode
mac:
  artifactName: "Hubcode-${version}-${arch}.${ext}"
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/hubcode
      to: bin/hubcode
  target:
    - dmg
    - zip
linux:
  category: Development
  icon: assets
  artifactName: "Hubcode-${version}-${arch}.${ext}"
  maintainer: "Mohamed Boudra <hello@moboudra.com>"
  vendor: "Hubcode"
  extraResources:
    - from: bin/hubcode
      to: bin/hubcode
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
win:
  icon: assets/icon.ico
  extraResources:
    - from: bin/hubcode.cmd
      to: bin/hubcode.cmd
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
