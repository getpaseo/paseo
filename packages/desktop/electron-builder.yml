npmRebuild: false
appId: sh.hubcode.desktop
productName: Hubcode
executableName: Hubcode
afterPack: ./scripts/after-pack.js
directories:
  output: release
files:
  - dist/**/*
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
extraResources:
  - from: ../app/dist
    to: app-dist
  - from: ../../skills
    to: skills
publish:
  provider: github
  owner: hubtool
  repo: hubcode
mac:
  artifactName: "Hubcode-${version}-${arch}.${ext}"
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  hardenedRuntime: true
  # notarize requires a valid Apple Developer team. Set teamId here
  # AFTER enrolling Hubcode in the Apple Developer Program and
  # generating a "Developer ID Application" cert under that team.
  # Set to true once configured; until then, builds run unsigned.
  notarize: false
  # identity: null forces unsigned builds. Without it, electron-builder
  # silently picks up the FIRST "Developer ID Application" cert in the
  # operator's Keychain — which has burned us before by accidentally
  # signing Hubcode with an unrelated company's cert (PATUBANK LTDA).
  identity: null
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/hubcode
      to: bin/hubcode
  target:
    - dmg
    - zip
linux:
  category: Development
  icon: assets
  artifactName: "Hubcode-${version}-${arch}.${ext}"
  maintainer: "Gustavo Junior <ceo@hubcode.ai>"
  vendor: "Hubcode"
  extraResources:
    - from: bin/hubcode
      to: bin/hubcode
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
win:
  icon: assets/icon.ico
  extraResources:
    - from: bin/hubcode.cmd
      to: bin/hubcode.cmd
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
