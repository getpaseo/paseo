"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[prompts]
general = """
Use `main` as the repository base branch and pull-request target by default. When the workspace records a different starting base branch, use that branch instead.
Never target `paseo-local` unless the user explicitly requests it. Do not ask for extra confirmation solely because the pull request targets `main`.
"""
create_pr = """
Create the pull request against the workspace's recorded starting base branch, defaulting to `main`. Do not ask for extra confirmation solely because the target is `main`.
"""
