name: Build all-feats desktop

# Builds the desktop app from local/all-feats and publishes artifacts to this
# fork's Releases. Version: <upstream version>-af.<yyyymmdd>.<shortsha>, e.g.
# 0.11.1-af.20261008.40fae44. Triggered by sync-all-feats.yml, or manually.

on:
  # Any push to local/all-feats builds automatically (merge a feature branch
  # and push — no manual step). CI-only edits and docs skip the build.
  push:
    branches:
      - local/all-feats
    paths-ignore:
      - ".github/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: build-all-feats
  cancel-in-progress: true

permissions:
  contents: write

env:
  DESKTOP_PACKAGE_PATH: packages/desktop

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: local/all-feats
          fetch-depth: 1

      - name: Compute version
        id: version
        run: |
          base=$(node -p "require('./${DESKTOP_PACKAGE_PATH}/package.json').version")
          date=$(date -u +%Y%m%d)
          sha=$(git rev-parse --short HEAD)
          version="${base}-af.${date}.${sha}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

  create-release:
    runs-on: ubuntu-latest
    needs: version
    timeout-minutes: 5
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create release
        run: |
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Paseo all-feats ${VERSION}" \
            --notes "Built from \`local/all-feats\` at ${{ github.sha }}." \
            || gh release view "v${VERSION}" --repo "${{ github.repository }}"

  build:
    runs-on: ${{ matrix.os }}
    needs: [version, create-release]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            # Explicit target names override the per-target arch lists in
            # electron-builder.yml; "--win --x64" alone would still build arm64.
            targets: "--win nsis zip --x64"
          - os: macos-latest
            name: macos
            targets: "--mac --arm64"
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: local/all-feats
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Stamp version
        shell: bash
        run: |
          node -e "
            const fs = require('node:fs');
            const p = process.env.DESKTOP_PACKAGE_PATH + '/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Stamp fork build meta
        shell: bash
        run: |
          node -e "
            const fs = require('node:fs');
            const meta = {
              version: process.env.VERSION,
              builtAt: new Date().toISOString(),
              commit: process.env.GITHUB_SHA,
            };
            const body = '// AUTO-GENERATED by build-all-feats.yml at build time. Do not edit.\nexport const FORK_BUILD_META = ' + JSON.stringify(meta, null, 2) + ';\n';
            fs.writeFileSync('packages/app/src/fork-build-meta.ts', body);
          "

      - name: Build desktop
        shell: bash
        env:
          EP_GH_IGNORE_TIME: "true"
        run: |
          set -euo pipefail
          npm run build:desktop -- --publish never ${{ matrix.targets }}

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd "${DESKTOP_PACKAGE_PATH}/release"
          gh release upload "v${VERSION}" \
            *.exe *.zip *.dmg latest*.yml *.blockmap \
            --clobber --repo "${{ github.repository }}"

      - name: Upload workflow artifact backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            ${{ env.DESKTOP_PACKAGE_PATH }}/release/*.exe
            ${{ env.DESKTOP_PACKAGE_PATH }}/release/*.zip
            ${{ env.DESKTOP_PACKAGE_PATH }}/release/*.dmg
            ${{ env.DESKTOP_PACKAGE_PATH }}/release/*.yml
            !${{ env.DESKTOP_PACKAGE_PATH }}/release/builder-debug.yml
          retention-days: 7
          if-no-files-found: ignore
