name: Build Paseo v0.6.1 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Paseo v0.6.1
        uses: actions/checkout@v4
        with:
          ref: v0.6.1
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build app dependencies
        run: |
          npm run build:app-deps
          npm run build:terminal-webview --workspace=@getpaseo/app

      - name: Generate Android project
        working-directory: packages/app
        env:
          APP_VARIANT: production
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build release APK
        working-directory: packages/app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APK="packages/app/android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: paseo-v0.6.1-android
          path: packages/app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
