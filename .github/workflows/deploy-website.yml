name: Deploy Website

# Marketing site → hubcode.ai (Cloudflare Worker `hubcode-website`).
# The web app at app.hubcode.ai is served from the self-hosted k8s cluster,
# NOT from this workflow.

on:
  push:
    branches:
      - main
    paths:
      - 'packages/website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install
        working-directory: packages/website

      - name: Build
        run: npm run build
        working-directory: packages/website

      - name: Deploy to Cloudflare Workers (hubcode-website → hubcode.ai)
        run: npx wrangler deploy
        working-directory: packages/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 10ed39a1dbf316e30abd0c409bed40d6
