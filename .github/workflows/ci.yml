name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Biome format check
        run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Build internal workspace deps
        # Some workspace TS projects depend on built artifacts from siblings
        # (e.g. @hubcode/highlight). Build daemon-side artifacts before
        # typechecking so cross-workspace imports resolve.
        run: npm run build:daemon
      - name: Typecheck all workspaces
        run: npm run typecheck

  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Build internal workspace deps
        run: npm run build:daemon
      - name: Server unit tests
        run: npm run test:unit --workspace=@hubcode/server

  test-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Build internal workspace deps
        run: npm run build:daemon
      - name: CLI tests
        run: npm run test --workspace=@hubcode/cli

  test-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Build internal workspace deps
        run: npm run build:daemon
      - name: App tests
        run: npm run test --workspace=@hubcode/app

  test-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Build internal workspace deps
        run: npm run build:daemon
      - name: Desktop tests
        run: npm run test --workspace=@hubcode/desktop
