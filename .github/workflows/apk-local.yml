name: APK Local Build (Release)

on:
  push:
    tags:
      - "v*"
      - "android-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. android-v0.7.1-jankfix). Leave empty to use current ref."
        required: false
        default: ""

concurrency:
  group: apk-local-${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.tag || github.ref) || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  build-apk:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
            exit 0
          fi
          release_args=(
            release create "$RELEASE_TAG"
            --repo "${{ github.repository }}"
            --title "Paseo $RELEASE_TAG"
            --notes ""
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          if ! gh "${release_args[@]}"; then
            echo "Release creation raced; continuing."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build workspace packages
        run: npm run build:protocol && npm run build:app-deps

      - name: Generate release keystore (auto)
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/paseo-release.keystore"
          if [[ ! -f "$KEYSTORE_PATH" ]]; then
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -alias paseo \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass paseo123 -keypass paseo123 \
              -dname "CN=Paseo, OU=Paseo, O=Paseo, L=City, S=State, C=US"
          fi
          echo "PASEO_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Generated keystore at $KEYSTORE_PATH"

      - name: Expo prebuild (Android)
        shell: bash
        run: |
          set -euo pipefail
          cd packages/app
          npx expo prebuild --platform android --clean --non-interactive

      - name: Configure signing for release
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="packages/app/android"
          GRADLE_PROPS="$APP_DIR/gradle.properties"
          KEYSTORE_DEST="$APP_DIR/app/paseo-release.keystore"
          cp "$PASEO_RELEASE_KEYSTORE_PATH" "$KEYSTORE_DEST"
          # Append signing props if not present
          grep -q "MYAPP_RELEASE_STORE_FILE" "$GRADLE_PROPS" || cat >> "$GRADLE_PROPS" <<'EOF'
          MYAPP_RELEASE_STORE_FILE=paseo-release.keystore
          MYAPP_RELEASE_KEY_ALIAS=paseo
          MYAPP_RELEASE_STORE_PASSWORD=paseo123
          MYAPP_RELEASE_KEY_PASSWORD=paseo123
          EOF
          cat "$GRADLE_PROPS"
          # Ensure build.gradle uses our signingConfig — Expo template already reads
          # MYAPP_* props, but as a fallback patch the file if needed.
          BUILD_GRADLE="$APP_DIR/app/build.gradle"
          if ! grep -q "MYAPP_RELEASE_STORE_FILE" "$BUILD_GRADLE"; then
            echo "Patching build.gradle to use release keystore..."
            # Insert signingConfigs release block if missing is complex; instead
            # rely on Expo's default. Just log for debugging.
            grep -n "signingConfigs" "$BUILD_GRADLE" | head
          fi

      - name: Build APK (Gradle assembleRelease)
        shell: bash
        run: |
          set -euo pipefail
          cd packages/app/android
          # Retry on Maven Central 429 with exponential backoff
          for attempt in 1 2 3 4; do
            echo "Gradle attempt $attempt/4..."
            if ./gradlew assembleRelease \
              -x lint -x lintVitalAnalyzeRelease -x lintVitalRelease \
              -x generateReleaseLintModel -x generateReleaseLintVitalModel \
              --no-daemon --max-workers=1 -Dorg.gradle.parallel=false \
              -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64; then
              echo "Gradle succeeded on attempt $attempt"
              break
            fi
            ec=$?
            if [ $attempt -eq 4 ]; then
              echo "Gradle failed after 4 attempts"
              exit $ec
            fi
            sleep $((attempt * 30))
            echo "Retrying..."
          done

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find packages/app/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [[ -z "$APK_PATH" ]]; then
            echo "No APK found!"
            find packages/app/android/app/build/outputs -type f | head -n 50
            exit 1
          fi
          ls -lh "$APK_PATH"
          ASSET_NAME="paseo-${RELEASE_TAG}-android.apk"
          ASSET_PATH="$RUNNER_TEMP/$ASSET_NAME"
          cp "$APK_PATH" "$ASSET_PATH"
          echo "apk_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "${{ steps.apk.outputs.apk_path }}" --clobber --repo "${{ github.repository }}"
          echo "Uploaded ${{ steps.apk.outputs.asset_name }} to $RELEASE_TAG"

      - name: Upload artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: paseo-android-apk
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 14
