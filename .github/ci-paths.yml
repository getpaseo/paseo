# Pull-request checks are routed by the behavior they prove. Package consumers
# do not inherit their dependencies' test suites; main and manual runs execute
# every contract regardless of these paths.
routing:
  - ".github/ci-paths.yml"

workspace:
  - ".mise.toml"
  - ".tool-versions"
  - "package.json"
  - "package-lock.json"
  - "patches/**"
  - "scripts/**"
  - "tsconfig.json"
  - "tsconfig.base.json"
  - "vitest.config.ts"

ci:
  - ".github/actions/**"
  - ".github/workflows/ci.yml"

format:
  - ".agents/**/*.{cjs,css,html,js,json,jsonc,jsx,md,mjs,ts,tsx,yaml,yml}"
  - ".github/**/*.{cjs,css,html,js,json,jsonc,jsx,md,mjs,ts,tsx,yaml,yml}"
  - "**/*.{cjs,css,html,js,json,jsonc,jsx,md,mjs,ts,tsx,yaml,yml}"

quality:
  - "**/*.{cjs,js,json,jsx,mjs,ts,tsx}"

hub:
  - "packages/cli/src/commands/hub/**"
  - "packages/server/src/server/hub/**"

server:
  - "packages/server/**"
  - "packages/app/e2e/fixtures/recording.*"

desktop:
  - "packages/desktop/**"

desktop_bridge:
  - "packages/desktop/src/*.{ts,tsx}"
  - "packages/desktop/src/features/browser-*.{ts,tsx}"
  - "packages/desktop/src/features/browser-*/**"
  - "packages/desktop/scripts/browser-*.mjs"
  - "packages/desktop/*.{json,yml}"
  - "packages/app/src/**/browser-*.{ts,tsx}"
  - "packages/app/*.{cjs,js,json,ts}"

app:
  - "packages/app/**"

sdk:
  - "packages/client/**"
  - "packages/highlight/**"
  - "packages/protocol/**"

playwright:
  - "packages/app/src/**"
  - "packages/app/e2e/**"
  - "packages/app/assets/**"
  - "packages/app/public/**"
  - "packages/app/index.ts"
  - "packages/app/*config.{cjs,js,ts}"
  - "packages/app/package.json"

playwright_desktop:
  - "packages/app/src/**/*.electron.{ts,tsx}"
  - "packages/app/e2e/**"
  - "packages/app/*config.{cjs,js,ts}"
  - "packages/app/package.json"

relay:
  - "packages/relay/**"

cli:
  - "packages/cli/**"
