version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hubcode-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: hubcode
      POSTGRES_PASSWORD: hubcode_secret
      POSTGRES_DB: hubtool_auth
    volumes:
      - hubcode_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubcode -d hubcode_auth"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth-server:
    build:
      context: ./auth-server
      dockerfile: Dockerfile
    container_name: hubcode-auth
    restart: unless-stopped
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./auth-server/.env
    environment:
      DATABASE_URL: postgresql://hubcode:hubcode_secret@postgres:5432/hubcode_auth
      PORT: 3002

  # LiveKit SFU — replaces coturn + in-house WebRTC signaling. Clients
  # fetch short-lived JWT tokens from auth-server (/api/livekit/token).
  # Production: switch to `network_mode: host` and set LIVEKIT_EXTERNAL_IP.
  livekit:
    image: livekit/livekit-server:latest
    container_name: hubcode-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "50000-50100:50000-50100/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret_at_least_32_chars_long_ok}"
    command:
      - --dev
      - --bind=0.0.0.0
      - --node-ip=${LIVEKIT_EXTERNAL_IP:-127.0.0.1}
      - --rtc.port_range_start=50000
      - --rtc.port_range_end=50100

volumes:
  hubcode_pgdata:
