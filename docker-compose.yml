version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hubcode-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: hubcode
      POSTGRES_PASSWORD: hubcode_secret
      POSTGRES_DB: hubtool_auth
    volumes:
      - hubcode_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubcode -d hubcode_auth"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth-server:
    build:
      context: ./auth-server
      dockerfile: Dockerfile
    container_name: hubcode-auth
    restart: unless-stopped
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./auth-server/.env
    environment:
      DATABASE_URL: postgresql://hubcode:hubcode_secret@postgres:5432/hubcode_auth
      PORT: 3002

volumes:
  hubcode_pgdata:
