version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hubcode-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: hubcode
      POSTGRES_PASSWORD: hubcode_secret
      POSTGRES_DB: hubtool_auth
    volumes:
      - hubcode_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubcode -d hubcode_auth"]
      interval: 5s
      timeout: 3s
      retries: 5

  # auth-server moved to ../hubtool/auth-server (standalone repo).
  # Run it independently: `cd ../hubtool/auth-server && npm run dev`.

  # LiveKit SFU — replaces coturn + in-house WebRTC signaling. Clients
  # fetch short-lived JWT tokens from auth-server (/api/livekit/token).
  # Production: switch to `network_mode: host` and set LIVEKIT_EXTERNAL_IP.
  livekit:
    image: livekit/livekit-server:latest
    container_name: hubcode-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "50000-50100:50000-50100/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret_at_least_32_chars_long_ok}"
    command:
      - --dev
      - --bind=0.0.0.0
      - --node-ip=${LIVEKIT_EXTERNAL_IP:-127.0.0.1}
      - --rtc.port_range_start=50000
      - --rtc.port_range_end=50100

  # LocalStack — S3-compatible object storage for chat uploads in dev.
  # Auth-server issues presigned PUT URLs that the client uploads to directly.
  localstack:
    image: localstack/localstack:3
    container_name: hubcode-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEBUG: "0"
      PERSISTENCE: "1"
    volumes:
      - hubcode_localstack:/var/lib/localstack

volumes:
  hubcode_pgdata:
  hubcode_localstack:
